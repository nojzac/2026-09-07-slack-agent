# Slack app manifest — paste at https://api.slack.com/apps → Create New App → From a manifest.
# Production URL is filled in below and live.
display_information:
  name: joestar
  description: Mention me and I reply in the thread with a random number.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: joestar
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
settings:
  event_subscriptions:
    request_url: https://joestar-agent-five.vercel.app/api/slack/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false

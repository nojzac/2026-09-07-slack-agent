name: test and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Node version Vercel runs the function on.
          node-version: 24.x

      # No dependencies and no lockfile: the bot is stdlib-only, so there is
      # nothing to install. Add a cache step here when that stops being true.
      - name: Run tests
        working-directory: joestar-agent
        run: npm test

  deploy:
    # The whole point: production only moves if the tests passed. Vercel's own
    # git trigger is off (see joestar-agent/vercel.json), so this is the only
    # path to production.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Deploy from the repo root: Vercel applies the project's own Root
      # Directory (joestar-agent) on top of wherever the CLI is run, so doing
      # this inside joestar-agent/ makes it look for joestar-agent/joestar-agent.
      - name: Deploy to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Node version Vercel runs the function on.
          node-version: 24.x

      # No dependencies and no lockfile: the bot is stdlib-only, so there is
      # nothing to install. Add a cache step here when that stops being true.
      - name: Run tests
        working-directory: joestar-agent
        run: npm test
